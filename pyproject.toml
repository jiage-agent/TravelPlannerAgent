[project]
name = "travel-planner-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "chainlit>=2.12.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-cli[inmem]>=0.4.31",
    "notebook>=7.6.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "tavily-python>=0.8.3",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# ============================================================
# pytest 配置
# ------------------------------------------------------------
# 默认只跑"零成本"用例：不调用真实 LLM、不访问外网
# （双重保险：需要 LLM 的用例默认 skip；tests/conftest.py 里还有外网熔断器，
#   任何漏网的 outbound 连接都会让用例失败，而不是悄悄产生 API 账单）
#
# 只跑默认用例：        uv run pytest -q
# 跑需要真实 LLM 的用例：  $env:RUN_INTEGRATION_TESTS="1"; uv run pytest -q -m integration
# ============================================================
[tool.pytest.ini_options]
# 所有 `async def test_*` 自动按协程执行，无需逐个加 @pytest.mark.asyncio
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 只从 tests/ 收集用例
testpaths = ["tests"]
# -ra: 结尾打印 skip / xfail / error 的原因汇总
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: 需要真实 LLM 或外部网络（会产生 API 费用），默认跳过；显式开启：RUN_INTEGRATION_TESTS=1 pytest -m integration",
]

